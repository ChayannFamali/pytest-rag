[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "pytest-rag"
version = "0.0.1"
description = "Retrieval-quality CI gate for pytest: nDCG/recall/MRR, paired bootstrap, per-query diff. No LLM, no network, deterministic."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "ChayannFamali", email = "dima.veselow2011@yandex.ru" },
]
keywords = [
    "pytest",
    "plugin",
    "rag",
    "retrieval",
    "ndcg",
    "mrr",
    "benchmark",
    "ci-gate",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: Pytest",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Testing",
]
dependencies = [
    "pytest>=7.0",
    "numpy>=1.24",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.6",
    "mypy>=1.10",
    "nox>=2024.4",
    "pytest-cov>=5.0",
    "pytest-xdist>=3.6",
]
# `report` is intentionally empty in RG-0.2. Per AGENTS.md §6, additions like
# scipy/pandas/rich/jinja2/pydantic require explicit human approval. The extras
# slot is reserved so `uv sync --all-extras` resolves the RG-0.2 DoD; concrete
# dependencies will land in RG-6.5 / RG-6.6.
report = []

[project.scripts]
rag-eval = "pytest_rag.cli:main"

[project.entry-points.pytest11]
pytest_rag = "pytest_rag.plugin"

[project.urls]
Homepage = "https://github.com/ChayannFamali/pytest-rag"
Source = "https://github.com/ChayannFamali/pytest-rag"
Issues = "https://github.com/ChayannFamali/pytest-rag/issues"

[tool.hatch.build]
packages = ["src/pytest_rag"]

[tool.hatch.build.targets.wheel]
packages = ["src/pytest_rag"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]
ignore = []

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "B011"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.10"
strict = true
warn_unused_ignores = true
warn_unreachable = true
disallow_untyped_defs = true
no_implicit_optional = true
check_untyped_defs = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers"]
markers = [
    "rag: retrieval quality gate tests (registered by pytest-rag at import time)",
    "slow: marks tests as slow (deselect with -m 'not slow')",
]
