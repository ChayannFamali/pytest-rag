name: CI

"on":
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel in-flight CI on a forced push to the same PR/branch (saves CI
# minutes; mimics GitHub's default for non-fork PRs).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  matrix:
    name: "lint+types+tests (${{ matrix.python }} × pytest ${{ matrix.pytest-channel }})"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13"]
        # Two channels per PLANNING.md §1 DoD ("CI green on 3.10–3.13 ×
        # pytest 7/8"). The committed pyproject.toml pin is "pytest>=7,<9";
        # the matrix installs the chosen channel as a *post-sync* override
        # into the existing venv so the file is never mutated by CI.
        pytest-channel:
          - "7"
          - "8"
    env:
      # UV_LINK_MODE=copy suppresses "Atomic file replacement failed" on
      # overlayfs (GitHub-hosted ubuntu-latest cache vs. workspace). Copy
      # is the safe default; hardlinks would be faster on a single FS.
      UV_LINK_MODE: copy
      # Deterministic test environment: timezone, locale, and PYTHONHASHSEED
      # locked so future bootstrap work (RG-5.2) inherits a stable baseline.
      TZ: UTC
      LC_ALL: C.UTF-8
      PYTHONHASHSEED: "0"
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.6"
          enable-cache: false

      - name: Set up Python ${{ matrix.python }}
        run: uv python install ${{ matrix.python }}

      - name: Sync dependencies (committable pin)
        # `uv sync --all-extras` resolves the runtime pin ("pytest>=7,<9")
        # into the project venv. The matrix channel is then layered on top
        # without touching pyproject.toml.
        run: uv sync --all-extras --quiet

      - name: Layer pytest channel ${{ matrix.pytest-channel }}
        # Override the resolved pytest with the chosen major. We do NOT
        # rewrite pyproject.toml — the override is confined to the venv.
        # The "pin stays committed" invariant comes from this step being
        # limited to `uv pip install --python <venv>`.
        #
        # READ-THE-VERSION VIA $python_bin DIRECTLY, NOT `uv run python`.
        # `uv run python ...` triggers a fresh `uv sync` as a side effect,
        # which would roll back the override we just installed and report
        # the wrong version (causally confirmed on 2026-08-15 with a
        # local reproducer). Calling the venv interpreter directly via
        # $python_bin bypasses sync and reads the post-override state.
        run: |
          python_bin=$(uv run python -c "import sys; print(sys.executable)")
          uv pip install --python "$python_bin" --quiet "pytest==${PYTEST_CHANNEL}.*"
          resolved=$("$python_bin" -c "import importlib.metadata as m; print(m.version('pytest'))")
          case "$resolved" in
            ${PYTEST_CHANNEL}.*) echo "OK resolved pytest $resolved" ;;
            *) echo "ERROR: resolved pytest $resolved does not match channel ${PYTEST_CHANNEL}.x" && exit 1 ;;
          esac
        env:
          PYTEST_CHANNEL: ${{ matrix.pytest-channel }}

      - name: 'Pre-flight: requested sessions exist in noxfile'
        # nox 2026.8.10 (the version pinned in noxfile.py via 'nox>=2024.4')
        # does NOT support --error-on-no-session. We verified that with
        # `uv run nox --help`: the choice of error-on-* flags is restricted
        # to --error-on-external-run and --error-on-missing-interpreters.
        # nox already explodes with "Error while collecting sessions.
        # Sessions not found: <name>" if a -s argument is wrong, so a
        # dedicated "error on no session" flag is redundant. We add a
        # belt-and-braces pre-flight: read all @nox.session-decorated
        # functions from noxfile.py via Python AST and fail loudly if any
        # of the six CI names is missing.
        #
        # Why AST and not `nox -l`?
        # `nox -l` / `--list-sessions` / `--list` all filter by
        # `nox.options.sessions` (default ["lint", "types", "tests"] in
        # noxfile.py) and therefore hide the NO-OP sessions. `--json`
        # emits the same filtered list. The only way to see *all* sessions
        # is to read the source. AST is the lightest-weight form of
        # such a read; it does not execute the file.
        #
        # And why not `uv run python` here either? Because `uv run` runs
        # `uv sync` first as a side effect, which would race with our
        # pytest override from the previous step. We call the venv
        # interpreter directly via the explicit `.venv/bin/python3`.
        run: |
          python_bin=".venv/bin/python3"
          available=$("$python_bin" - <<'PYEOF'
          import ast, pathlib
          tree = ast.parse(pathlib.Path("noxfile.py").read_text())
          for node in ast.walk(tree):
              if isinstance(node, ast.FunctionDef):
                  for dec in node.decorator_list:
                      f = dec.func
                      if isinstance(f, ast.Attribute) and f.attr == "session" and isinstance(f.value, ast.Name) and f.value.id == "nox":
                          print(node.name)
          PYEOF
          )
          requested="lint types tests metrics_verify selftest docs"
          missing=""
          for s in $requested; do
            if ! echo "$available" | grep -qx "$s"; then
              missing="$missing $s"
            fi
          done
          if [ -n "$missing" ]; then
            echo "ERROR: nox-sessions missing in noxfile.py:$missing" >&2
            echo "Available: $available" >&2
            exit 1
          fi
          echo "OK all requested nox sessions are present"

      - name: Run nox sessions
        # Explicit session list (rather than relying on nox.options.sessions
        # in noxfile.py) so the three NO-OP sessions emit a visible "skipped"
        # status to CI reviewers instead of being silently omitted.
        # --non-interactive prevents REPL hangs. We do NOT pass
        # --error-on-no-session: that flag is not implemented in nox
        # 2026.8.10 (see the pre-flight step above for the explicit
        # check that replaces it).
        run: |
          uv run nox --non-interactive \
                       -s lint-${{ matrix.python }} \
                       -s types-${{ matrix.python }} \
                       -s tests-${{ matrix.python }} \
                       -s metrics_verify-${{ matrix.python }} \
                       -s selftest-${{ matrix.python }} \
                       -s docs-${{ matrix.python }}

      - name: Upload coverage artifact (tests session only)
        if: success() || failure()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.python }}-pytest${{ matrix.pytest-channel }}
          path: .coverage*
          if-no-files-found: ignore

  # Integrity check: greppable guards for the AGENTS.md §4 invariants. Runs
  # after the matrix so a CI green on code but a broken invariant still
  # fails the workflow. Kept as a separate job so the matrix stays fast
  # and the invariants stay readable.
  invariants:
    name: "invariants (I-NOLLM, I-NET, I-ISOLATION)"
    runs-on: ubuntu-latest
    needs: matrix
    steps:
      - uses: actions/checkout@v4
      - name: Install pytest (any 7.x–8.x)
        run: python -m pip install --quiet "pytest>=7,<9"
      - name: I-NOLLM
        # No LLM/embedder imports in the runtime package.
        run: |
          ! grep -RIn --include='*.py' -E \
            '^(from|import)[[:space:]]+(openai|anthropic|cohere|google\.genai|vertexai|llama_index|langchain|sentence_transformers|transformers)\b' \
            src/pytest_rag
      - name: I-NET
        # No network imports in the runtime package. URI schemes in
        # docstrings are fine; this regex looks for actual code symbols.
        run: |
          ! grep -RIn --include='*.py' -E \
            '(requests|urllib|httpx|aiohttp|websocket)\b' \
            src/pytest_rag
      # I-ISOLATION-greppable: static regex guard. This is NOT the canonical
      # pytester-based I-ISOLATION test scheduled for RG-8.4. The greppable
      # guard catches import-time side effects the regex can see; the
      # pytester-based test (RG-8.4) catches option/marker registration
      # regressions and unknown-flag effects on third-party tests.
      - name: I-ISOLATION-greppable
        # The plugin module must not pull heavy deps at import time, and
        # must not write to stdout/stderr during import.
        run: |
          ! grep -RIn --include='*.py' -E \
            '^(from|import)[[:space:]]+(numpy|scipy|pandas|sklearn)\b' \
            src/pytest_rag/plugin.py
          ! grep -RIn --include='*.py' -E '^(print|input)\(' \
            src/pytest_rag/plugin.py
